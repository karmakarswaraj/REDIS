services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017" 
    environment:
      MONGO_INITDB_DATABASE: learn_redis
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  redis_data: 


